</head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Input, Select, Checkbox, Radio, Switch, Field, Icon, Card, StatTile, Badge, Tag, ProgressBar, DataTable, EmptyState, Timer, Duration, TimeEntryRow, Tabs, SidebarNav, Dialog, Toast, ToastStack, Tooltip } = window.HoursDesignSystem_76f0a9;
