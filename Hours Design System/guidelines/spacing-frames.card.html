<!-- @dsCard group="Spacing" viewport="700x170" name="Fixed frames" subtitle="Sidebar, top bar, row and control heights are constants" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);height:170px;overflow:hidden}.row{display:flex;gap:12px}.lb{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:500}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}.frame{border:1px solid var(--line-rule);border-radius:6px;overflow:hidden;height:110px;display:flex;background:var(--surface-card)}.side{width:116px;background:var(--surface-sunken);border-right:1px solid var(--line-rule);display:flex;align-items:center;justify-content:center}.main{flex:1;display:flex;flex-direction:column}.top{height:30px;border-bottom:1px solid var(--line-rule);display:flex;align-items:center;padding:0 10px}.rows{flex:1;display:flex;flex-direction:column}.r{height:22px;border-bottom:1px solid var(--line-hairline);display:flex;align-items:center;padding:0 10px}</style></head><body>
<div class="frame"><div class="side"><span class="mono">--sidebar-w 232</span></div><div class="main"><div class="top"><span class="mono">--topbar-h 60</span></div><div class="rows"><div class="r"><span class="mono">--row-h 44</span></div><div class="r"><span class="mono">--control-h 34 · sm 26 · lg 42</span></div><div class="r"><span class="mono">--measure 66ch</span></div></div></div></div></body></html>
