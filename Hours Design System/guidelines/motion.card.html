<!-- @dsCard group="Motion" viewport="700x150" name="Duration &amp; easing" subtitle="Short, flat, no overshoot — hover the bars" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);height:150px;overflow:hidden}.row{display:flex;gap:12px}.lb{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:500}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}.g{display:flex;flex-direction:column;gap:10px}.r{display:flex;align-items:center;gap:12px}.t{flex:1;height:6px;background:var(--paper-200);border-radius:99px;overflow:hidden}.f{height:100%;width:24%;background:var(--pine-500);border-radius:99px}.g:hover .f{width:100%}.f1{transition:width 80ms cubic-bezier(.2,.6,.2,1)}.f2{transition:width 130ms cubic-bezier(.2,.6,.2,1)}.f3{transition:width 190ms cubic-bezier(.2,.6,.2,1)}.f4{transition:width 280ms cubic-bezier(.2,.6,.2,1)}</style></head><body>
<div class="g"><div class="r"><span class="mono" style="width:170px">--dur-instant 80ms</span><div class="t"><div class="f f1"></div></div></div><div class="r"><span class="mono" style="width:170px">--dur-fast 130ms</span><div class="t"><div class="f f2"></div></div></div><div class="r"><span class="mono" style="width:170px">--dur-base 190ms</span><div class="t"><div class="f f3"></div></div></div><div class="r"><span class="mono" style="width:170px">--dur-slow 280ms</span><div class="t"><div class="f f4"></div></div></div><span class="mono">--ease-out cubic-bezier(.2,.6,.2,1) · no springs, no bounce</span></div></body></html>
