<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Invoice + entry states, each a fg/bg pair" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);height:150px;overflow:hidden}.row{display:flex;gap:12px}.lb{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:500}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}.s{flex:1;display:flex;flex-direction:column;gap:8px;align-items:flex-start}.pill{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:3px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:500}.dot{width:5px;height:5px;border-radius:99px;background:currentColor}</style></head><body>
<div class="row"><div class="s"><span class="pill" style="background:var(--status-live-bg);color:var(--status-live)"><span class="dot"></span>Running</span><span class="mono">--status-live</span></div><div class="s"><span class="pill" style="background:var(--status-paid-bg);color:var(--status-paid)"><span class="dot"></span>Paid</span><span class="mono">--status-paid</span></div><div class="s"><span class="pill" style="background:var(--status-pending-bg);color:var(--status-pending)"><span class="dot"></span>Pending</span><span class="mono">--status-pending</span></div><div class="s"><span class="pill" style="background:var(--status-overdue-bg);color:var(--status-overdue)"><span class="dot"></span>Overdue</span><span class="mono">--status-overdue</span></div><div class="s"><span class="pill" style="background:var(--status-draft-bg);color:var(--status-draft)"><span class="dot"></span>Draft</span><span class="mono">--status-draft</span></div><div class="s"><span class="pill" style="background:var(--status-info-bg);color:var(--status-info)"><span class="dot"></span>Info</span><span class="mono">--status-info</span></div></div></body></html>
