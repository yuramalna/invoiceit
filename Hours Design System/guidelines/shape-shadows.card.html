<!-- @dsCard group="Shape" viewport="700x160" name="Elevation" subtitle="Shallow and warm; most surfaces use a rule instead of a shadow" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);height:160px;overflow:hidden}.row{display:flex;gap:12px}.lb{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:500}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}.g{display:flex;gap:18px}.b{flex:1;display:flex;flex-direction:column;gap:8px}.s{height:70px;background:var(--surface-raised);border-radius:8px;border:1px solid var(--line-hairline)}</style></head><body>
<div class="g"><div class="b"><div class="s" style="box-shadow:var(--shadow-sm)"></div><span class="mono">--shadow-sm</span></div><div class="b"><div class="s" style="box-shadow:var(--shadow-card)"></div><span class="mono">--shadow-card</span></div><div class="b"><div class="s" style="box-shadow:var(--shadow-popover)"></div><span class="mono">--shadow-popover</span></div><div class="b"><div class="s" style="box-shadow:var(--shadow-modal)"></div><span class="mono">--shadow-modal</span></div></div></body></html>
