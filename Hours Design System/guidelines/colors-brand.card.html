<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);height:150px;overflow:hidden}.row{display:flex;gap:12px}.lb{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:500}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:5px;border:1px solid var(--line-hairline)}.n{font-size:11.5px;color:var(--ink-700)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--pine-700)"></div><div class="n">Pine 700</div><div class="mono">--pine-700</div></div><div class="sw"><div class="chip" style="background:var(--pine-600)"></div><div class="n">Pine 600</div><div class="mono">--pine-600</div></div><div class="sw"><div class="chip" style="background:var(--pine-500)"></div><div class="n">Pine 500</div><div class="mono">--pine-500</div></div><div class="sw"><div class="chip" style="background:var(--pine-200)"></div><div class="n">Pine 200</div><div class="mono">--pine-200</div></div><div class="sw"><div class="chip" style="background:var(--pine-50)"></div><div class="n">Pine 50</div><div class="mono">--pine-50</div></div><div class="sw"><div class="chip" style="background:var(--terracotta-500)"></div><div class="n">Terracotta 500</div><div class="mono">--terracotta-500</div></div><div class="sw"><div class="chip" style="background:var(--terracotta-200)"></div><div class="n">Terracotta 200</div><div class="mono">--terracotta-200</div></div><div class="sw"><div class="chip" style="background:var(--terracotta-50)"></div><div class="n">Terracotta 50</div><div class="mono">--terracotta-50</div></div></div></body></html>
