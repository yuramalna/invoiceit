<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);height:150px;overflow:hidden}.row{display:flex;gap:12px}.lb{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:500}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}.g{display:flex;gap:20px}.col{flex:1;display:flex;flex-direction:column;gap:10px}.l{height:0;border-top:1px solid}.tex{height:66px;background-image:var(--texture-rule);border:1px solid var(--line-rule);border-radius:6px}</style></head><body>
<div class="g"><div class="col"><span class="mono">--line-hairline</span><div class="l" style="border-color:var(--line-hairline)"></div><span class="mono">--line-rule</span><div class="l" style="border-color:var(--line-rule)"></div><span class="mono">--line-strong</span><div class="l" style="border-color:var(--line-strong)"></div></div><div class="col"><span class="mono">--texture-rule</span><div class="tex"></div></div></div></body></html>
