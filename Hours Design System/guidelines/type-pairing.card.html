<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);height:180px;overflow:hidden}.mono{font-family:var(--font-mono);font-size:9.5px;letter-spacing:-.04em;color:var(--text-muted)}.card{background:var(--surface-card);border:1px solid var(--line-rule);border-radius:8px;padding:20px 24px;display:flex;justify-content:space-between;align-items:flex-end}.eb{font-size:var(--label-size);letter-spacing:var(--label-ls);text-transform:uppercase;color:var(--text-muted);font-weight:500}.h{font-family:var(--font-display);font-weight:600;font-size:var(--display-3-size);letter-spacing:var(--display-3-ls);color:var(--ink-900);margin-top:6px}.p{font-size:13px;letter-spacing:-.008em;color:var(--text-muted);margin-top:6px}.big{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:32px;letter-spacing:var(--num-ls);color:var(--ink-900)}</style></head><body>
<div class="card"><div><div class="eb">July · unbilled</div><div class="h">Alder &amp; Vine</div><div class="p">14 entries across 3 projects, ready to invoice</div></div><div class="big">$4,180.00</div></div></body></html>
