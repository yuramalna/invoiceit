<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);height:150px;overflow:hidden}.row{display:flex;gap:12px}.lb{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:500}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:5px;border:1px solid var(--line-hairline)}.n{font-size:11.5px;color:var(--ink-700)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--ink-100)"></div><div class="n">Ink 100</div><div class="mono">--ink-100</div></div><div class="sw"><div class="chip" style="background:var(--ink-200)"></div><div class="n">Ink 200</div><div class="mono">--ink-200</div></div><div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="n">Ink 300</div><div class="mono">--ink-300</div></div><div class="sw"><div class="chip" style="background:var(--ink-400)"></div><div class="n">Ink 400</div><div class="mono">--ink-400</div></div><div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="n">Ink 500</div><div class="mono">--ink-500</div></div><div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="n">Ink 700</div><div class="mono">--ink-700</div></div><div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="n">Ink 900</div><div class="mono">--ink-900</div></div></div></body></html>
