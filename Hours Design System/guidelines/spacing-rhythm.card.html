<!-- @dsCard group="Spacing" viewport="700x160" name="Semantic rhythm" subtitle="Named spacing aliases used instead of raw values" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);height:160px;overflow:hidden}.row{display:flex;gap:12px}.lb{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:500}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}table{border-collapse:collapse;width:100%}td{padding:5px 0;font-size:12px;color:var(--ink-700);border-bottom:1px solid var(--line-hairline)}td.k{font-family:var(--font-mono);color:var(--text-muted);width:150px}td.v{font-family:var(--font-mono);width:56px;color:var(--ink-900)}</style></head><body>
<table><tr><td class="k">--stack-tight</td><td class="v">8px</td><td>label → value</td></tr><tr><td class="k">--stack</td><td class="v">16px</td><td>within a block</td></tr><tr><td class="k">--stack-loose</td><td class="v">32px</td><td>between blocks</td></tr><tr><td class="k">--gutter-inline</td><td class="v">24px</td><td>padding inside cards and rows</td></tr><tr><td class="k">--gutter-page</td><td class="v">40px</td><td>app page margin</td></tr><tr><td class="k">--section-gap</td><td class="v">64px</td><td>between page sections</td></tr></table></body></html>
