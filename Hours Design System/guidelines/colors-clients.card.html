<!-- @dsCard group="Colors" viewport="700x130" name="Client identity" subtitle="Assigned in order as clients are added; used only as dots and bar fills" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-page);height:130px;overflow:hidden}.row{display:flex;gap:12px}.lb{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-weight:500}.mono{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}.c{flex:1;display:flex;flex-direction:column;gap:8px}.bar{height:4px;border-radius:99px}.dot{width:9px;height:9px;border-radius:99px}</style></head><body>
<div class="row"><div class="c"><div class="dot" style="background:var(--client-1)"></div><div class="bar" style="background:var(--client-1)"></div><div class="mono">--client-1</div></div><div class="c"><div class="dot" style="background:var(--client-2)"></div><div class="bar" style="background:var(--client-2)"></div><div class="mono">--client-2</div></div><div class="c"><div class="dot" style="background:var(--client-3)"></div><div class="bar" style="background:var(--client-3)"></div><div class="mono">--client-3</div></div><div class="c"><div class="dot" style="background:var(--client-4)"></div><div class="bar" style="background:var(--client-4)"></div><div class="mono">--client-4</div></div><div class="c"><div class="dot" style="background:var(--client-5)"></div><div class="bar" style="background:var(--client-5)"></div><div class="mono">--client-5</div></div><div class="c"><div class="dot" style="background:var(--client-6)"></div><div class="bar" style="background:var(--client-6)"></div><div class="mono">--client-6</div></div></div></body></html>
